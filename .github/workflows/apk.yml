# APK de test (release), à lancer à la main : Actions → « APK de test » → Run workflow.
# Fichier séparé de analyze.yml pour éviter un échec au démarrage du workflow.
name: APK de test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      # Le dépôt ne contient pas le dossier android/ : on le génère ici, sans toucher à lib/ ni à pubspec.yaml.
      - name: Dossier Android
        run: flutter create --platforms=android --project-name kahwetne --org com.kahwetne .

      - name: Nom et icône « Korti Fans »
        run: bash tool/apply_app_identity.sh android

      - name: IDs AdMob (Android)
        run: bash tool/patch_ad_app_ids.sh android

      # Crash au lancement en release : R8 supprime une classe de WorkManager (WorkDatabase_Impl).
      # On désactive la réduction R8 du build release, sans toucher au code.
      - name: Désactiver R8 en release
        run: |
          python3 - <<'PYEOF'
          import os, re
          for f in ['android/app/build.gradle.kts', 'android/app/build.gradle']:
              if not os.path.exists(f):
                  continue
              s = open(f, encoding='utf-8').read()
              if re.search(r'isMinifyEnabled\s*=\s*true', s):
                  s = re.sub(r'isMinifyEnabled\s*=\s*true', 'isMinifyEnabled = false', s)
              elif re.search(r'minifyEnabled\s+true', s):
                  s = re.sub(r'minifyEnabled\s+true', 'minifyEnabled false', s)
              else:
                  is_kts = f.endswith('.kts')
                  line = 'isMinifyEnabled = false' if is_kts else 'minifyEnabled false'
                  s = re.sub(r'(release\s*\{)', r'\1\n            ' + line, s, count=1)
              s = re.sub(r'(isShrinkResources|shrinkResources)(\s*=\s*|\s+)true', r'\1\2false', s)
              if not re.search(r'(isShrinkResources|shrinkResources)', s):
                  s = re.sub(r'(release\s*\{)', r'\1\n            ' + ('isShrinkResources = false' if f.endswith('.kts') else 'shrinkResources false'), s, count=1)
              print('--- lignes minify/shrink dans ' + f)
              print('\n'.join(l for l in s.splitlines() if re.search(r'minify|shrink', l, re.I)))
              open(f, 'w', encoding='utf-8').write(s)
              print('--- ' + f)
              m = re.search(r'release\s*\{[^}]*\}', s)
              print(m.group(0) if m else 'release block introuvable')
          PYEOF

      # Bug du lint Android (plugin webview_flutter_android) qui fait échouer assembleRelease :
      # on désactive les tâches lintVital, sans toucher au code ni aux dépendances.
      - name: Désactiver le lint bloquant
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/no-lint.gradle <<'EOF'
          allprojects {
            tasks.matching { it.name.startsWith('lintVital') }.configureEach { enabled = false }
          }
          EOF

      - name: Dépendances
        run: flutter pub get

      - name: Compilation APK (release)
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: kahwetne-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
