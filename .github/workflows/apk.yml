# APK de test (release), à lancer à la main : Actions → « APK de test » → Run workflow.
# Fichier séparé de analyze.yml pour éviter un échec au démarrage du workflow.
name: APK de test

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      # Le dépôt ne contient pas le dossier android/ : on le génère ici, sans toucher à lib/ ni à pubspec.yaml.
      - name: Dossier Android
        run: flutter create --platforms=android --project-name kahwetne --org com.kahwetne .

      - name: Dépendances
        run: flutter pub get

      - name: Compilation APK (release)
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: kahwetne-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
