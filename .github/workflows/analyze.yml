# Vérifie que le projet compile : flutter pub get puis flutter analyze.
# Les erreurs apparaissent dans l'onglet Actions du dépôt GitHub.
name: Analyse Flutter

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Analyse statique (erreurs de compilation)
        # Les infos (ex. dépréciations de material.dart) ne bloquent pas : seules les erreurs et avertissements comptent.
        run: flutter analyze --no-fatal-infos

      - name: Tests unitaires
        run: flutter test
