# Vérifie que le projet compile : flutter pub get puis flutter analyze.
# Les erreurs apparaissent dans l'onglet Actions du dépôt GitHub.
name: Analyse Flutter

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Formatage (dart format)
        # Le pipeline échoue si un fichier Dart n'est pas formaté.
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyse statique (erreurs de compilation)
        # Les infos (ex. dépréciations de material.dart) ne bloquent pas : seules les erreurs et avertissements comptent.
        run: flutter analyze --no-fatal-infos

      - name: Tests unitaires (avec couverture)
        run: flutter test --coverage

      - name: Seuil de couverture (40 %)
        # Couverture des lignes de coverage/lcov.info. Seuil de départ à 40 %, à relever au fil des tests (#167). Objectif : 90 %.
        run: |
          awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END {
            if (lf == 0) { print "Aucune ligne dans lcov.info"; exit 1 }
            pct = 100 * lh / lf
            printf "Couverture : %.2f %% (%d / %d lignes)\n", pct, lh, lf
            if (pct < 40) { print "Échec : couverture sous le seuil de 40 %"; exit 1 }
          }' coverage/lcov.info
          echo "Fichiers avec le plus de lignes non couvertes (non couvertes, couvertes/total, fichier) :"
          awk -F: '/^SF:/{f=substr($0,4)} /^LF:/{lf=$2} /^LH:/{lh=$2} /^end_of_record/{printf "%d\t%d/%d\t%s\n", lf-lh, lh, lf, f}' coverage/lcov.info | sort -rn | head -25
