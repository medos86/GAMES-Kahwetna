# Vérifie que le projet compile : flutter pub get puis flutter analyze.
# Les erreurs apparaissent dans l'onglet Actions du dépôt GitHub.
name: Analyse Flutter

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Analyse statique (erreurs de compilation)
        run: flutter analyze

      - name: Tests unitaires
        run: flutter test

  # APK de test : compilé en release (les sons et la latence ne se testent bien qu'en release).
  apk:
    # Uniquement sur demande (bouton « Run workflow »), jamais à chaque push.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Le dépôt ne contient pas le dossier android/ (généré par flutter create sur Mac) :
      # on le génère ici, sans toucher à lib/ ni à pubspec.yaml.
      - name: Dossier Android
        run: flutter create --platforms=android --project-name kahwetne --org tn.kahwetne .

      - name: Dépendances
        run: flutter pub get

      - name: Compilation APK (release)
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: kahwetne-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
