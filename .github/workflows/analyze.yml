# Vérifie que le projet compile : flutter pub get puis flutter analyze.
# Les erreurs apparaissent dans l'onglet Actions du dépôt GitHub.
name: Analyse Flutter

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Formatage (dart format)
        # Le pipeline échoue si un fichier Dart n'est pas formaté.
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyse statique (erreurs de compilation)
        # Les infos (ex. dépréciations de material.dart) ne bloquent pas : seules les erreurs et avertissements comptent.
        run: flutter analyze --no-fatal-infos

      - name: Tests unitaires (avec couverture)
        run: flutter test --coverage

      - name: Seuil de couverture (90 %)
        # Pourcentage de lignes couvertes dans coverage/lcov.info. Le pipeline échoue sous 90 % (#167).
        run: |
          awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END {
            if (lf == 0) { print "Aucune ligne dans lcov.info"; exit 1 }
            pct = 100 * lh / lf
            printf "Couverture : %.2f %% (%d / %d lignes)\n", pct, lh, lf
            if (pct < 90) { print "Échec : couverture sous le seuil de 90 %"; exit 1 }
          }' coverage/lcov.info
