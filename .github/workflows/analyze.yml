# Vérifie que le projet compile et que les tests passent.
# Découpage en jobs parallèles (#724) : analyse, tests par shard, fusion de couverture.
# Les erreurs apparaissent dans l'onglet Actions du dépôt GitHub.
name: Analyse Flutter

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un nouveau push annule le run précédent de la même branche (évite de gaspiller des minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Formatage (dart format)
        # Le pipeline échoue si un fichier Dart n'est pas formaté.
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyse statique (erreurs de compilation)
        # Les infos (ex. dépréciations de material.dart) ne bloquent pas : seules les erreurs et avertissements comptent.
        run: flutter analyze --no-fatal-infos

      - name: Test script IDs AdMob (grep portable, #619)
        run: bash tool/test_patch_ad_app_ids.sh

      - name: Test fusion de couverture (#724)
        run: bash tool/test_merge_coverage.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Chaque shard couvre un sous-ensemble de test/ ; l'ensemble couvre les 206 fichiers.
        # Les tests publicité (#479) sont dans test/core et test/widgets : plus de doublon.
        shard:
          - name: core
            paths: test/core
          - name: widgets
            paths: test/widgets
          # Le shard game était le goulot (11 min seul) : découpé en trois.
          - name: game-rami-a-l
            paths: "test/game/rami_ai_test.dart test/game/rami_discard_rule_test.dart test/game/rami_draw_exhausted_test.dart test/game/rami_easy_draw_test.dart"
          # Garde-fou niveaux IA : un seul test de simulation d'environ 8 min, isolé pour ne pas rallonger les autres shards.
          - name: game-rami-levels
            paths: test/game/rami_levels_smoke_test.dart
          - name: game-rami-m-z
            paths: "test/game/rami_[m-z]*_test.dart test/game/rami_test.dart"
          - name: game-autres
            paths: "test/game/[cdls]*_test.dart"
          - name: features-a-d
            paths: "test/features/[a-d]*_test.dart test/features/age_gate"
          - name: features-e-m
            paths: "test/features/[e-m]*_test.dart"
          - name: features-n-z
            paths: "test/features/[n-z]*_test.dart test/features/menu test/features/settings"
          - name: reste
            paths: test/app test/layout test/parity test/style test/rami_scores_overlay_test.dart test/rami_seat_badge_test.dart
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Tests unitaires du shard ${{ matrix.shard.name }} (avec couverture)
        run: flutter test --coverage --concurrency=4 ${{ matrix.shard.paths }}

      - name: Renommer la couverture du shard
        run: mv coverage/lcov.info coverage-${{ matrix.shard.name }}.info

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.shard.name }}
          path: coverage-${{ matrix.shard.name }}.info
          retention-days: 1

  coverage:
    needs: [analyze, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: shards
          merge-multiple: true

      - name: Fusion de la couverture des shards
        # Fusion par ligne (lcov) : une ligne partagée entre shards n'est pas comptée deux fois.
        run: |
          mkdir -p coverage
          bash tool/merge_coverage.sh coverage/lcov.info shards/*.info

      - name: Seuil de couverture (80 %)
        # Couverture des lignes de coverage/lcov.info. Seuil à 80 % (#167), à relever au fil des tests. Objectif : 90 %.
        run: |
          awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END {
            if (lf == 0) { print "Aucune ligne dans lcov.info"; exit 1 }
            pct = 100 * lh / lf
            printf "Couverture : %.2f %% (%d / %d lignes)\n", pct, lh, lf
            if (pct < 80) { print "Échec : couverture sous le seuil de 80 %"; exit 1 }
          }' coverage/lcov.info
          echo "Fichiers avec le plus de lignes non couvertes (non couvertes, couvertes/total, fichier) :"
          awk -F: '/^SF:/{f=substr($0,4)} /^LF:/{lf=$2} /^LH:/{lh=$2} /^end_of_record/{printf "%d\t%d/%d\t%s\n", lf-lh, lh, lf, f}' coverage/lcov.info | sort -rn | head -25
