# Captures d'écran des écrans, à lancer à la main : Actions → « Captures d'écran » → Run workflow.
# Les PNG sont disponibles dans l'artifact « captures-ecrans ». Ne bloque pas analyze.yml.
name: Captures d'écran

on:
  workflow_dispatch:
    inputs:
      screens:
        description: "Écrans à capturer : all, ou une liste séparée par des virgules (ex. menu,settings)"
        required: true
        default: "all"

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Génération des captures
        run: flutter test test/screenshots --update-goldens --dart-define=SCREENS=${{ inputs.screens }}

      - uses: actions/upload-artifact@v4
        with:
          name: captures-ecrans
          path: test/screenshots/goldens/
          retention-days: 14
