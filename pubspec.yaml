# pubspec minimal pour l'analyse (CI). Sur ton Mac, garde le pubspec.yaml généré par flutter create
# et ajoute les dépendances avec flutter pub add.
name: kahwetne
description: Jeux de cartes kahwetne (Chkobba, Domino, Belote, Ludo, Rami).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_soloud: any
  flutter_svg: any
  shared_preferences: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: any
  flutter_lints: any

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/cards_cartoon/
    - assets/icons/
    - assets/sounds/domino/
  fonts:
    # Licences : voir ATTRIBUTIONS.md (OFL pour Nunito et Bowlby One SC, Apache 2.0 pour Roboto Slab).
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-400.ttf
          weight: 400
        - asset: assets/fonts/Nunito-600.ttf
          weight: 600
        - asset: assets/fonts/Nunito-700.ttf
          weight: 700
        - asset: assets/fonts/Nunito-800.ttf
          weight: 800
        - asset: assets/fonts/Nunito-900.ttf
          weight: 900
    - family: RobotoSlab
      fonts:
        - asset: assets/fonts/RobotoSlab-Regular.ttf
          weight: 400
        - asset: assets/fonts/RobotoSlab-600.ttf
          weight: 600
        - asset: assets/fonts/RobotoSlab-Bold.ttf
          weight: 700
        - asset: assets/fonts/RobotoSlab-800.ttf
          weight: 800
        - asset: assets/fonts/RobotoSlab-900.ttf
          weight: 900
    - family: BowlbyOneSC
      fonts:
        - asset: assets/fonts/BowlbyOneSC-Regular.ttf
    # Thème BD (issue #12) : titres et onomatopées en Bangers, texte arabe et repli en Tajawal.
    - family: Bangers
      fonts:
        - asset: assets/fonts/Bangers-Regular.ttf
          weight: 400
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
