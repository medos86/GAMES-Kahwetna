# pubspec minimal pour l'analyse (CI). Sur ton Mac, garde le pubspec.yaml généré par flutter create
# et ajoute les dépendances avec flutter pub add.
name: kahwetne
description: Jeux de cartes kahwetne (Chkobba, Domino, Belote, Ludo, Rami).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_soloud: any
  flutter_svg: any
  shared_preferences: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: any

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/cards_cartoon/
    - assets/icons/
    - assets/sounds/domino/
  fonts:
    # Roboto Slab (Apache 2.0). Nunito et Bowlby One SC : à ajouter quand les fichiers sont dans assets/fonts/.
    - family: RobotoSlab
      fonts:
        - asset: assets/fonts/RobotoSlab-Regular.ttf
          weight: 400
        - asset: assets/fonts/RobotoSlab-Bold.ttf
          weight: 700
